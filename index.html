
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Москва 90-х</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#171313;color:#eee4d7;
 font-family:Arial,sans-serif;padding:15px;
}
header{text-align:center;padding:15px}
h1{color:#c8a36b;letter-spacing:3px}
.subtitle{color:#9c8980;font-size:12px}
.panel{
 background:#251d1b;border:1px solid #514039;
 border-radius:14px;padding:15px;margin-bottom:12px;
}
button{
 background:#483128;color:#f1dfc7;border:1px solid #8b664b;
 border-radius:9px;padding:12px;cursor:pointer;
}
button:active{transform:scale(.98)}
button.active{background:#85603c}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.menu button{width:100%}
.card{
 background:#302522;border-radius:10px;
 padding:12px;margin:8px 0;border:1px solid #59443a;
}
.small{font-size:12px;color:#b7a69b}
.gold{color:#d2ad72}
.red{color:#cf8277}
.hidden{display:none}
.progress{
 height:7px;background:#493b34;border-radius:10px;
 overflow:hidden;margin-top:8px
}
.progress div{height:100%;background:#c69b60;width:20%}
#content{margin-top:15px}
</style>
</head>
<body>

<header>
 <div class="gold">ИСТОРИЧЕСКАЯ СТРАТЕГИЯ</div>
 <h1>МОСКВА 90-х</h1>
 <div class="subtitle">КРИМИНАЛЬНЫЕ ХРОНИКИ · 1991–2000</div>
</header>

<div class="panel">
 <h3>Выбери реальность</h3>
 <div class="buttons">
  <button id="historic" class="active">📜 Историческая</button>
  <button id="alternate">🎭 Альтернативная</button>
 </div>
 <p class="small" id="modeText">
  Документальная история Москвы.
 </p>
</div>

<div class="panel">
 <div class="gold">ТЕКУЩИЙ ГОД</div>
 <h2 id="year">1991</h2>
 <div class="small">Москва, Россия</div>
</div>

<div class="menu">
 <button onclick="show('map')">🗺 Карта Москвы</button>
 <button onclick="show('groups')">Организации</button>
 <button onclick="show('people')">Персонажи</button>
 <button onclick="show('events')">Хронология</button>
 <button onclick="show('business')">Предприятия</button>
 <button onclick="show('story')">Сюжет</button>
</div>

<div id="content" class="panel">
 <h3>Добро пожаловать</h3>
 <p>Начни исследование Москвы 1991 года.</p>
</div>

<script>
const tg=window.Telegram?.WebApp;
tg?.ready();
tg?.expand();

let mode=localStorage.getItem("moscow_mode")||"historic";
let year=Number(localStorage.getItem("moscow_year"))||1991;
let influence=Number(localStorage.getItem("moscow_influence"))||20;
let money=Number(localStorage.getItem("moscow_money"))||1000;

const districts=[
"Чертаново","Северное Чертаново","Южное Чертаново",
"Бирюлёво","Царицыно","Орехово-Борисово",
"Люблино","Марьино","Печатники","Кузьминки",
"Текстильщики","Измайлово","Перово","Гольяново",
"Сокольники","Солнцево","Кунцево","Медведково",
"Отрадное","Алтуфьево","Арбат","Таганский район"
];

const groups=[
"Солнцевская",
"Ореховская",
"Измайловская",
"Люберецкая",
"Подольская",
"Долгопрудненская",
"Медведковская",
"Таганская"
];

const people=[
{
 name:"Сергей Тимофеев",
 nickname:"Сильвестр",
 info:"Реальная историческая фигура, известная в материалах о московском криминальном мире 1990-х. Биографические сведения и связи необходимо проверять по историческим источникам."
}
];

const events=[
[1991,"Распад СССР","Начало новой политической и экономической эпохи."],
[1992,"Экономические реформы","Изменение экономической системы страны."],
[1993,"Политический кризис","Серьёзные события политической истории России."],
[1994,"Перемены в Москве","Продолжение экономической и общественной трансформации."],
[1995,"Середина десятилетия","Изменение городской и экономической среды."],
[1996,"Президентские выборы","Важный политический период."],
[1997,"Экономическое развитие","Изменение деловых отношений."],
[1998,"Финансовый кризис","Дефолт и экономические последствия."],
[1999,"Переходный период","Новая политическая эпоха."],
[2000,"Новое десятилетие","Изменение общественной жизни."]
];

function save(){
 localStorage.setItem("moscow_mode",mode);
 localStorage.setItem("moscow_year",year);
 localStorage.setItem("moscow_influence",influence);
 localStorage.setItem("moscow_money",money);
}

function setMode(m){
 mode=m;
 document.getElementById("historic").classList.toggle("active",m==="historic");
 document.getElementById("alternate").classList.toggle("active",m==="alternate");
 document.getElementById("modeText").textContent=
 m==="historic"
 ?"Историческая хроника. Реальные личности и события, без изменения подтверждённой истории."
 :"Альтернативная реальность. Вымышленные организации и собственные сюжетные решения.";
 save();
 show("home");
}

document.getElementById("historic").onclick=()=>setMode("historic");
document.getElementById("alternate").onclick=()=>setMode("alternate");

function show(page){
 const c=document.getElementById("content");
 let html="";

 if(page==="home"){
 html="<h3>Москва, 1991 год</h3><p>Выбери раздел игры.</p>";
 }

 if(page==="map"){
 html="<h3>Районы Москвы</h3>";
 districts.forEach(d=>{
 html+=`<div class="card">
 <b>${d}</b>
 <p class="small">Историческая справка и события района.</p>
 <button onclick="districtInfo('${d}')">Открыть</button>
 </div>`;
 });
 }

 if(page==="groups"){
 html="<h3>Исторический каталог</h3>";
 if(mode==="historic"){
 groups.forEach(g=>{
 html+=`<div class="card">
 <b>${g}</b>
 <p class="small">Историческое досье. Сведения требуют проверки по источникам.</p>
 </div>`;
 });
 }else{
 ["Союз Речной","Кооператив Южный","Артель Восток"].forEach(g=>{
 html+=`<div class="card">
 <b>${g}</b>
 <p class="small">Вымышленная организация альтернативной кампании.</p>
 </div>`;
 });
 }
 }

 if(page==="people"){
 html="<h3>Персонажи</h3>";
 if(mode==="historic"){
 people.forEach(p=>{
 html+=`<div class="card">
 <h3>${p.name}</h3>
 <div class="gold">${p.nickname}</div>
 <p class="small">${p.info}</p>
 </div>`;
 });
 }else{
 html="<p>В альтернативном режиме используются вымышленные персонажи.</p>";
 }
 }

 if(page==="events"){
 html="<h3>Хронология</h3>";
 events.forEach(e=>{
 html+=`<div class="card">
 <b class="gold">${e[0]} год</b>
 <h4>${e[1]}</h4>
 <p class="small">${e[2]}</p>
 </div>`;
 });
 }

 if(page==="business"){
 html="<h3>Предприятия</h3>";
 if(mode==="historic"){
 html="<h3>Экономическая история</h3><p>Изучение предприятий и экономических перемен эпохи.</p>";
 }else{
 html+=`<div class="card">
 <b>Автомастерская</b>
 <p>Стоимость проекта: 300 рублей.</p>
 <button onclick="buy(300)">Развивать</button>
 </div>
 <div class="card">
 <b>Магазин</b>
 <p>Стоимость проекта: 500 рублей.</p>
 <button onclick="buy(500)">Развивать</button>
 </div>
 <div class="card">
 <b>Общественный центр</b>
 <p>Стоимость проекта: 250 рублей.</p>
 <button onclick="buy(250)">Развивать</button>
 </div>`;
 }
 }

 if(page==="story"){
 html="<h3>Сюжет</h3>";
 if(mode==="historic"){
 html+="<p>Историческая хроника. Изучай события и реальные биографии. Исторические исходы не меняются.</p>";
 }else{
 html+=`
 <div class="card">
 <h3>Городские перемены</h3>
 <p>Жители района хотят открыть общественный центр.</p>
 <button onclick="decision(8,150)">Поддержать проект</button>
 <button onclick="decision(5,100)">Помочь местным мастерским</button>
 </div>`;
 }
 }

 c.innerHTML=html;
 document.getElementById("year").textContent=year;
}

function districtInfo(name){
 document.getElementById("content").innerHTML=`
 <h3>${name}</h3>
 <p>Историческая карточка района.</p>
 <p class="small">Административные границы и названия необходимо сверять с картой выбранного года.</p>`;
}

function buy(cost){
 if(mode!=="alternate")return;
 if(money<cost){alert("Недостаточно средств");return;}
 money-=cost;
 influence=Math.min(100,influence+5);
 save();
 alert("Проект развит. Общественная поддержка увеличилась.");
 show("business");
}

function decision(points,cost){
 if(money<cost){alert("Недостаточно средств");return;}
 money-=cost;
 influence=Math.min(100,influence+points);
 year=Math.min(2000,year+1);
 save();
 alert("Решение принято. Поддержка: "+influence);
 show("story");
}

document.getElementById("year").textContent=year;
setMode(mode);
</script>
</body>
</html>
