.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.stat b{display:block;font-size:18px;color:var(--gold2)}
.stat span{font-size:11px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:11px}
.card img{width:100%;height:130px;object-fit:cover;display:block}
.cardbody{padding:13px}
.tag{display:inline-block;padding:4px 7px;border-radius:5px;background:#34302a;color:var(--gold2);font-size:10px;margin:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.progress{height:7px;border-radius:10px;background:#353739;overflow:hidden;margin-top:7px}
.progress i{height:100%;display:block;background:var(--gold);width:50%}
.nav{position:fixed;bottom:0;left:0;right:0;background:#171819;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20}
.navinner{max-width:760px;width:100%;display:grid;grid-template-columns:repeat(5,1fr)}
.nav button{background:none;border:0;color:#aaa;padding:10px 2px 9px;font-size:10px}
.nav button span{display:block;font-size:19px;margin-bottom:3px}
.nav button.active{color:var(--gold2)}
.hidden{display:none!important}
.choice{width:100%;text-align:left;background:#252729;color:#eee;border:1px solid #444;border-radius:10px;padding:13px;margin:6px 0;line-height:1.4}
.choice:hover{border-color:var(--gold)}
.choice b{display:block;color:var(--gold2);margin-bottom:4px}
.mapgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0}
.mapcell{min-height:72px;background:#292d2b;border:1px solid #485148;border-radius:8px;color:#ddd;font-size:11px;padding:6px;display:flex;align-items:center;justify-content:center;text-align:center;position:relative}
.mapcell.open{background:#3b382c;border-color:#9a7844}
.mapcell.locked{opacity:.45}
.mapcell small{display:block;color:var(--gold2);font-size:9px}
.eventimage{width:100%;height:150px;object-fit:cover;border-radius:10px;margin:8px 0}
hr{border:0;border-top:1px solid var(--line);margin:13px 0}
input{background:#252729;color:white;border:1px solid #555;border-radius:8px;padding:10px;width:100%}
.footerNote{text-align:center;color:#777;font-size:10px;padding:18px}

function historyChoice(i){
 let s=S(),e=historyEvents.find(x=>x.year===s.year);if(!e)return;
 let c=e.choices[i],v=c[2];
 Object.keys(v).forEach(k=>{s[k]=(s[k]||0)+v[k]});
 s.money=Math.max(0,s.money);s.rep=clamp(s.rep);s.trust=clamp(s.trust);s.influence=clamp(s.influence);
 s.completed.push(s.year);s.xp+=25;s.log.push(s.year+": "+c[0]);s.eventIndex++;
 let idx=historyEvents.findIndex(x=>x.year===s.year);s.year=historyEvents[idx+1]?.year||2001;
 levelUp();save();render();
}
function altChoice(i){
 let s=S(),e=altEvents[s.altIndex%altEvents.length],c=e.choices[i],v=c[1];
 Object.keys(v).forEach(k=>{if(k==="moneyGain")s.money+=v[k];else s[k]=(s[k]||0)+v[k]});
 s.money=Math.max(0,s.money);s.rep=clamp(s.rep);s.trust=clamp(s.trust);s.influence=clamp(s.influence);
 s.xp+=20;s.completed.push("alt"+s.altIndex);s.log.push(e.title+": "+c[0]);s.altIndex++;
 if(s.altIndex%3===0)s.year=Math.min(2000,s.year+1);
 levelUp();save();render();
}
function levelUp(){let s=S();while(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.log.push("Получен новый уровень: "+s.level)}}

function upgradeBusiness(i){
 let s=S(),b=s.businesses[i],cost=1500+b.level*1000;if(s.money<cost){alert("Недостаточно средств.");return}

}

 ["Продвинуть кампанию","Завершить три сюжетных события",s.completed.length>=3]
 ];
 return `<h1>Задания</h1><p>Развивай организацию через экономику, знания и общественные проекты.</p>${tasks.map(t=>`<div class="panel"><div class="row"><b>${t[0]}</b><span class="tag">${t[2]?"Выполнено":"В процессе"}</span></div><p class="small">${t[1]}</p><div class="progress"><i style="width:${t[2]?100:15}%"></i></div></div>`).join("")}`;
}
function helpPage(){
 return `<button class="btn secondary smallbtn" onclick="go('more')">← Назад</button><h1>Как играть</h1>
 <div class="panel"><h3>1. Кампания</h3><p>Историческая кампания основана на реальных событиях. Альтернативная кампания рассказывает вымышленную историю выбранной организации.</p></div>
 <div class="panel"><h3>2. Деньги и предприятия</h3><p>Покупай предприятия, улучшай их и получай доход за сюжетные события. Доход можно собирать отдельно.</p></div>
 <div class="panel"><h3>3. Районы</h3><p>Изучай районы, открывай общественные и деловые проекты. Развитие районов повышает доверие и влияние.</p></div>
 <div class="panel"><h3>4. Показатели</h3><p>Репутация, доверие, влияние и знания определяют развитие кампании. Решения могут менять эти показатели.</p></div>
 <div class="panel"><h3>5. Сохранения</h3><p>Прогресс хранится в памяти браузера на этом устройстве. Очистка данных браузера может удалить сохранение.</p></div>
 <div class="panel"><h3>О карте и фотографиях</h3><p>Карта в этой версии схематическая. Изображения используются для атмосферы и не являются точными снимками указанных районов.</p></div>`;
}
function endingPanel(){
 let s=S();
 return `<div class="panel"><h3>Итоги кампании</h3>${stats()}<p>Завершено глав: ${s.completed.length}. Уровень: ${s.level}.</p><button class="btn" onclick="restartHistory()">Начать историческую кампанию заново</button></div>`;
}
function switchMode(){
 mode=mode==="history"?"alt":"history";
 if(mode==="alt"&&!db.alt.faction){renderFaction();return}
 if(!db[mode].started){page="home";render();return}
 page="home";render();
}
function resetCurrent(){
 if(!confirm("Сбросить прогресс текущей кампании?"))return;
 db[mode]=fresh(mode);save();page="home";render();
}
function restartHistory(){db.history=fresh("history");db.history.started=true;mode="history";page="home";save();render()}
render();
</script>
